<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マネーノート | 家計簿・食費・レシピ管理</title>

<!-- ホーム画面に追加した際、アプリらしく全画面表示されるための設定 -->
<meta name="theme-color" content="#6E8C5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マネーノート">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <header class="app-header">
      <span class="app-header-spacer"></span>
      <span class="app-header-title">マネーノート</span>
      <button class="app-header-settings" onclick="GasSync.openSettings()" title="スプレッドシート連携設定">⚙</button>
    </header>

    <main id="app-main">
      <div id="page-content"></div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item" data-page="home" onclick="App.navigate('home')">
        <span class="nav-icon">🏠</span><span class="nav-label">ホーム</span>
      </button>
      <button class="nav-item" data-page="monthlyreport" onclick="App.navigate('monthlyreport')">
        <span class="nav-icon">💰</span><span class="nav-label">家計管理</span>
      </button>
      <button class="nav-item" data-page="analysis" onclick="App.navigate('analysis')">
        <span class="nav-icon">🍽</span><span class="nav-label">食事管理</span>
      </button>
      <button class="nav-item" data-page="purchase" onclick="App.navigate('purchase')">
        <span class="nav-icon">🛒</span><span class="nav-label">食費登録</span>
      </button>
      <button class="nav-item" data-page="recipe" onclick="App.navigate('recipe')">
        <span class="nav-icon">📖</span><span class="nav-label">レシピ</span>
      </button>
      <button class="nav-item" data-page="insights" onclick="App.navigate('insights')">
        <span class="nav-icon">📊</span><span class="nav-label">分析</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>

  <!-- データ層 -->
  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="gas-sync.js"></script>

  <!-- 画面ロジック -->
  <script src="home.js"></script>
  <script src="purchase.js"></script>
  <script src="inventory.js"></script>
  <script src="photo.js"></script>
  <script src="recipe.js"></script>
  <script src="shopping.js"></script>
  <script src="analysis.js"></script>
  <script src="mealhistory.js"></script>
  <script src="expense.js"></script>
  <script src="monthlyreport.js"></script>
  <script src="insights.js"></script>

  <!-- アプリ本体 -->
  <script src="app.js"></script>
</body>
</html>
